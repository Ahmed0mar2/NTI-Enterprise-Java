<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h2>Customer Store</h2>
        <button onclick="logout()" style="width: auto; background: #dc3545; float: right;">Logout</button>
        <div style="clear: both;"></div>

        <h3 style="margin-top: 20px;">Products Catalog</h3>
        <div id="catalog" class="grid"></div>

        <h3 style="margin-top: 40px;">Shopping Cart</h3>
        <div id="cartList" style="margin-bottom: 15px;"></div>
        <button onclick="placeOrder()" style="background: #28a745;">Place Order</button>

        <h3 style="margin-top: 40px;">My Orders Status</h3>
        <div id="myOrders"></div>
    </div>

    <script src="js/script.js"></script>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'customer') {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        function loadCustomerView() {
            let products = JSON.parse(localStorage.getItem('products')) || [];
            let catalog = document.getElementById('catalog');
            catalog.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.image}" alt="${p.name}" style="width:100%; height:130px; object-fit:contain;">
                    <h4>${p.name}</h4>
                    <p>$${p.price}</p>
                    <button onclick="addToCart('${p.id}')">Add to Cart</button>
                </div>
            `).join('');

            let cartKey = 'cart_' + currentUser.id;
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
            let cartList = document.getElementById('cartList');

            if (cart.length === 0) {
                cartList.innerHTML = '<p style="color:#64748b;">Your cart is empty.</p>';
            } else {
                cartList.innerHTML = cart.map(item => {
                    let p = products.find(prod => prod.id === item.productId);
                    return `<p>${p ? p.name : 'Product'} - Quantity: ${item.quantity}</p>`;
                }).join('');
            }

            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            let myOrders = orders.filter(o => o.userId === currentUser.id);
            let ordersDiv = document.getElementById('myOrders');

            ordersDiv.innerHTML = myOrders.map(o => `
                <p style="margin-bottom: 8px;">Order ID: ${o.id} | Total: $${o.totalAmount} | Status: <b>${o.status}</b></p>
            `).join('') || '<p style="color:#64748b;">No previous orders.</p>';
        }

        function addToCart(productId) {
            let cartKey = 'cart_' + currentUser.id;
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
            let item = cart.find(i => i.productId === productId);

            if (item) {
                item.quantity += 1;
            } else {
                cart.push({ productId, quantity: 1 });
            }

            localStorage.setItem(cartKey, JSON.stringify(cart));
            loadCustomerView();
        }

        function placeOrder() {
            let cartKey = 'cart_' + currentUser.id;
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];

            if (cart.length === 0) {
                alert('Cart is empty');
                return;
            }

            let products = JSON.parse(localStorage.getItem('products')) || [];
            let total = 0;

            cart.forEach(item => {
                let p = products.find(prod => prod.id === item.productId);
                if (p) total += p.price * item.quantity;
            });

            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            let newOrder = {
                id: Date.now().toString(),
                userId: currentUser.id,
                userName: currentUser.name,
                items: cart,
                totalAmount: total,
                status: 'pending'
            };

            orders.push(newOrder);
            localStorage.setItem('orders', JSON.stringify(orders));
            localStorage.setItem(cartKey, JSON.stringify([]));

            alert('Order placed successfully!');
            loadCustomerView();
        }

        loadCustomerView();
    </script>
</body>

</html>
