<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container" style="max-width: 400px; margin-top: 50px;">
        <h2>Login</h2>
        <div id="errorMsg" style="color: #dc3545; margin-bottom: 10px; font-size: 14px;"></div>
        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" required>

            <label>Password</label>
            <input type="password" id="password" required>

            <button type="submit">Login</button>
        </form>
        <p style="margin-top: 15px; text-align: center;">Don't have an account? <a href="register.html">Register</a></p>
    </div>

    <script src="js/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;

            let users = JSON.parse(localStorage.getItem('users')) || [];
            let user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                document.getElementById('errorMsg').innerText = 'Invalid email or password.';
                return;
            }

            localStorage.setItem('currentUser', JSON.stringify(user));

            if (user.role === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'customer.html';
            }
        });
    </script>
</body>

</html>
