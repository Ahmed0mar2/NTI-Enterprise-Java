<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h2>Admin Dashboard</h2>
        <button onclick="logout()" style="width: auto; background: #dc3545; float: right;">Logout</button>
        <div style="clear: both;"></div>

        <h3 style="margin-top: 20px;">Manage Products</h3>
        <form id="productForm">
            <input type="hidden" id="prodId">
            <input type="text" id="prodName" placeholder="Product Name" required>
            <input type="text" id="prodImage" placeholder="Image URL" required>
            <input type="text" id="prodCategory" placeholder="Category" required>
            <input type="number" id="prodPrice" placeholder="Price" required>
            <input type="number" id="prodStock" placeholder="Stock Quantity" required>
            <textarea id="prodDesc" placeholder="Description"></textarea>
            <button type="submit">Save Product</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productsBody"></tbody>
        </table>

        <h3 style="margin-top: 40px;">Customer Orders</h3>
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
        </table>
    </div>

    <script src="js/script.js"></script>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'admin') {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }

        function loadAdminData() {
            let products = JSON.parse(localStorage.getItem('products')) || [];
            let pBody = document.getElementById('productsBody');
            pBody.innerHTML = products.map(p => `
                <tr>
                    <td>${p.name}</td>
                    <td>$${p.price}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button onclick="editProduct('${p.id}')" style="background:#ffc107; width:auto; padding:5px 10px;">Edit</button>
                        <button onclick="deleteProduct('${p.id}')" style="background:#dc3545; width:auto; padding:5px 10px;">Delete</button>
                    </td>
                </tr>
            `).join('');

            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            let oBody = document.getElementById('ordersBody');
            oBody.innerHTML = orders.map(o => `
                <tr>
                    <td>${o.id}</td>
                    <td>${o.userName || 'Customer'}</td>
                    <td>$${o.totalAmount}</td>
                    <td>${o.status}</td>
                    <td>
                        <button onclick="updateOrder('${o.id}', 'confirmed')" style="background:#28a745; width:auto; padding:5px 10px;">Confirm</button>
                        <button onclick="updateOrder('${o.id}', 'rejected')" style="background:#dc3545; width:auto; padding:5px 10px;">Reject</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('productForm').addEventListener('submit', function (e) {
            e.preventDefault();
            let id = document.getElementById('prodId').value;
            let name = document.getElementById('prodName').value;
            let image = document.getElementById('prodImage').value;
            let category = document.getElementById('prodCategory').value;
            let price = parseFloat(document.getElementById('prodPrice').value);
            let stock = parseInt(document.getElementById('prodStock').value);
            let description = document.getElementById('prodDesc').value;

            let products = JSON.parse(localStorage.getItem('products')) || [];

            if (id) {
                let p = products.find(item => item.id === id);
                if (p) {
                    p.name = name;
                    p.image = image;
                    p.category = category;
                    p.price = price;
                    p.stock = stock;
                    p.description = description;
                }
            } else {
                products.push({
                    id: Date.now().toString(),
                    name, image, category, price, stock, description
                });
            }

            localStorage.setItem('products', JSON.stringify(products));
            document.getElementById('productForm').reset();
            document.getElementById('prodId').value = '';
            loadAdminData();
        });

        function editProduct(id) {
            let products = JSON.parse(localStorage.getItem('products')) || [];
            let p = products.find(item => item.id === id);
            if (p) {
                document.getElementById('prodId').value = p.id;
                document.getElementById('prodName').value = p.name;
                document.getElementById('prodImage').value = p.image;
                document.getElementById('prodCategory').value = p.category;
                document.getElementById('prodPrice').value = p.price;
                document.getElementById('prodStock').value = p.stock;
                document.getElementById('prodDesc').value = p.description;
            }
        }

        function deleteProduct(id) {
            let products = JSON.parse(localStorage.getItem('products')) || [];
            products = products.filter(item => item.id !== id);
            localStorage.setItem('products', JSON.stringify(products));
            loadAdminData();
        }

        function updateOrder(orderId, status) {
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            let o = orders.find(item => item.id === orderId);
            if (o) {
                o.status = status;
                localStorage.setItem('orders', JSON.stringify(orders));
                loadAdminData();
            }
        }

        loadAdminData();
    </script>
</body>

</html>
